services:
  database:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: wechat-local-test
      MARIADB_DATABASE: wechat_test
    ports:
      - '127.0.0.1:33367:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports:
      - '127.0.0.1:36379:6379'
