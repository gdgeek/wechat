name: Verify and publish wechat2 backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mariadb:11.4
            health: healthcheck.sh --connect --innodb_initialized
          - database: mariadb:10.4
            health: mysqladmin ping -h 127.0.0.1 -pwechat-local-test --silent
          - database: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -pwechat-local-test --silent
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MARIADB_ROOT_PASSWORD: wechat-local-test
          MARIADB_DATABASE: wechat_test
          MYSQL_ROOT_PASSWORD: wechat-local-test
          MYSQL_DATABASE: wechat_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: wechat-local-test
      MYSQL_DATABASE: wechat_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DB: 0
      RUN_INTEGRATION: '1'
      V1_MYSQL_TEST_URL: mysql://root:wechat-local-test@127.0.0.1:3306/wechat_schema_test
      NODE_ENV: test
      JWT_SECRET: ci-test-key-only-not-for-deployment-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run migrate -- --bootstrap
      - run: npm test
      - run: npm run parity
      - run: docker build -t wechat2:test .
      - name: Verify migration in the production image
        run: >-
          docker run --rm --network host
          -e MYSQL_HOST -e MYSQL_PORT -e MYSQL_USER -e MYSQL_PASSWORD -e MYSQL_DATABASE
          wechat2:test npm run migrate:prod

  publish:
    name: Publish wechat2 image
    runs-on: ubuntu-latest
    needs: [verify]
    if: >-
      github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/publish'
      )
    env:
      REGISTRY: hkccr.ccs.tencentyun.com
      IMAGE_NAME: gdgeek/wechat2
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Tencent Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - name: Prepare image tags and metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.title=wechat2
      - name: Build and push wechat2
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
